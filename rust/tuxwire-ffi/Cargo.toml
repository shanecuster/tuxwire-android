# The "glue" library between Kotlin and tuxwire-core.
#
# Kotlin cannot call Rust directly. Android apps load native code as a shared
# library (a `.so` file) and call into it. This crate is that library: it takes
# the pieces of `tuxwire-core` the app needs and exports them in a shape UniFFI
# can bridge. UniFFI then generates the Kotlin side automatically.
[package]
name = "tuxwire-ffi"
version = "0.1.0"
edition = "2024"
# Not meant to be published to crates.io.
publish = false

[lib]
# The file name of the compiled library becomes `libtuxwire_ffi.so`; the Kotlin
# bindings load it by that name.
name = "tuxwire_ffi"
# A crate can be built in several forms at once:
#   "cdylib" = a C-compatible dynamic library -- the `.so` Android loads.
#   "lib"    = a normal Rust library -- lets this crate's own tests run, and
#              lets other Rust code link against it.
crate-type = ["cdylib", "lib"]

[dependencies]
# The shared engine (pinned to one exact commit in ../Cargo.toml).
tuxwire-core.workspace = true

# `features = ["tokio"]` adds support for `async fn` exports that need the tokio
# async runtime. Fetching a feed is network I/O, which in Rust means async code,
# and reqwest (the HTTP library inside tuxwire-core) only works on tokio.
uniffi = { workspace = true, features = ["tokio"] }

# The error type tuxwire-core returns; see the comment in ../Cargo.toml.
anyhow.workspace = true

# Crates used only by this crate's tests, never compiled into the phone library.
[dev-dependencies]
tokio.workspace = true
